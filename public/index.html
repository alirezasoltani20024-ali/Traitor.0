<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>نفوذی</title><link rel="stylesheet" href="style.css"></head><body><div id="menu" class="screen"><div class="card"><h1>🛰️ نفوذی</h1><p>بازی آنلاین شبیه Among Us</p><input id="name" placeholder="نام بازیکن" maxlength="18"><button id="create">ساخت اتاق</button><div class="join"><input id="code" placeholder="کد اتاق" maxlength="5"><button id="join">ورود</button></div><div id="msg"></div></div></div><div id="lobby" class="screen hidden"><div class="card"><h2>اتاق: <b id="roomCode"></b></h2><p><span id="count">0</span>/8 بازیکن</p><div id="players"></div><button id="copy">کپی لینک دعوت</button><button id="start">شروع بازی</button><small>حداقل ۳ بازیکن</small></div></div><canvas id="game"></canvas><div id="hud" class="hidden"><div class="topbar"><span id="role">نقش: خدمه</span><span>مأموریت: <b id="tasks">0/6</b></span></div><div id="buttons"><button id="taskBtn">🔧 مأموریت</button><button id="reportBtn">🚨 گزارش</button><button id="meetBtn">📢 جلسه</button><button id="killBtn" class="traitor hidden">🔪 کشتن</button></div><div id="joystick"><div id="joy"></div></div><div id="deadBox" class="hidden"><b>شما حذف شده‌اید</b><p>نقش خود را ادعا کنید:</p><button data-claim="crew">من خدمه بودم</button><button data-claim="infiltrator">من خائن بودم</button></div></div><div id="toast"></div><div id="meeting" class="overlay hidden"><div class="meetingCard"><h2>📢 جلسه</h2><p id="meetingText"></p><div id="claims"></div><button id="closeMeeting">ادامه بازی</button></div></div><div id="end" class="overlay hidden"><div class="meetingCard"><h1 id="winner"></h1><button onclick="location.reload()">بازی جدید</button></div></div><script src="/socket.io/socket.io.js"></script><script src="game.js"></script></body></html>
