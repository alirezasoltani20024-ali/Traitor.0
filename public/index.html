<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Space Mystery Pro</title><link rel="stylesheet" href="style.css"></head><body>
<div id="menu" class="card"><h1>🚀 Space Mystery</h1><p>بازی آنلاین ۳ تا ۸ نفره</p><input id="name" placeholder="نام بازیکن" maxlength="14"><select id="max"><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option selected>8</option></select><button onclick="create()">ساخت اتاق</button><div class="sep">یا</div><input id="codeIn" placeholder="کد اتاق"><button onclick="join()">ورود</button><div id="msg"></div></div>
<div id="lobby" class="card hide"><h2>اتاق <b id="code"></b></h2><p>این لینک را برای دوستانت بفرست:</p><div id="invite"></div><button onclick="copy()">📋 کپی لینک</button><div id="plist"></div><button id="start" onclick="start()">🚀 شروع بازی</button></div>
<div id="game" class="hide"><header><b id="role"></b><span id="taskText"></span><button onclick="emergency()">🚨 جلسه اضطراری</button></header><div id="map"><div class="station s1">⚙️</div><div class="station s2">🔧</div><div class="station s3">🧪</div><div class="station s4">🛰️</div><div id="me"></div></div>
<div class="bar"><button onclick="doTask()">🔧 انجام مأموریت</button><button id="kill" onclick="kill()">🔪 حذف</button><button onclick="report()">🚨 گزارش جسد</button></div><div id="pad"><button data-k="up">▲</button><div><button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button></div></div></div>
<div id="meeting" class="card hide"><h2>🚨 جلسه</h2><p id="meetingInfo"></p><div id="votes"></div></div><div id="result" class="card hide"></div>
<script src="/socket.io/socket.io.js"></script><script src="game.js"></script></body></html>
