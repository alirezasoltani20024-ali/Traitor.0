<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Space Mystery</title><link rel="stylesheet" href="style.css"></head><body>
<div id="menu" class="card"><h1>🚀 Space Mystery</h1><input id="name" maxlength="14" placeholder="نام بازیکن"><select id="max"><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option selected>8</option></select><button id="create">🎮 ساخت اتاق</button><hr><input id="room" maxlength="5" placeholder="کد اتاق"><button id="join">🚪 ورود</button><p id="msg"></p></div>
<div id="lobby" class="card hide"><h2>اتاق <b id="code"></b></h2><p>این لینک را برای دوستان بفرست:</p><div id="invite"></div><button id="copy">📋 کپی لینک</button><div id="players"></div><button id="start">🚀 شروع بازی</button><p id="lmsg"></p></div>
<div id="game" class="hide"><header><b id="role"></b><span id="tasks"></span><button id="emergency">🚨 جلسه</button></header><div id="map"><div class="room a">⚙️</div><div class="room b">🔧</div><div class="room c">🧪</div><div id="me"></div></div><div class="buttons"><button id="task">🔧 مأموریت</button><button id="kill">🔪 حذف</button><button id="report">🚨 گزارش</button></div><div id="pad"><button data-d="up">▲</button><br><button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button></div></div>
<div id="meeting" class="card hide"><h2>🚨 جلسه</h2><p id="meetingText"></p><div id="votes"></div></div><div id="result" class="card hide"></div>
<script src="/socket.io/socket.io.js"></script><script src="game.js"></script></body></html>
