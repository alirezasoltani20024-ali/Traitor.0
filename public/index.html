<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>نفوذی | ایستگاه فضایی</title><link rel="stylesheet" href="style.css"></head><body>
<div id="menu" class="screen"><div class="card"><h1>🔴 خائن</h1><p>بازی چندنفره خائن؛ دروغ بگو، خرابکاری کن و مخفیانه حذف کن!</p><input id="name" maxlength="18" placeholder="نام بازیکن"><button id="create" type="button">ساخت اتاق</button><div class="join"><input id="code" maxlength="5" placeholder="کد اتاق"><button id="join" type="button">ورود</button></div><div id="msg"></div></div></div>
<div id="lobby" class="screen hidden"><div class="card"><h2>اتاق: <b id="roomCode"></b></h2><p><span id="count">0</span>/8 بازیکن</p><div id="players"></div><button id="copy" type="button">کپی لینک دعوت</button><button id="start" type="button">شروع بازی</button><small>حداقل ۳ بازیکن لازم است.</small></div></div>
<canvas id="game"></canvas>
<div id="hud" class="hidden"><div class="topbar"><span id="role">نقش: خدمه</span><span>مأموریت: <b id="tasks">0/4</b></span><span id="status">آماده</span></div>
<div id="contextButtons"></div>
<div id="fixedButtons"><button id="mapBtn" type="button">🗺️ نقشه</button><button id="emergencyBtn" type="button">📢 جلسه اضطراری</button></div>
<div id="joystick"><div id="joy"></div></div>
<div id="deadBox" class="hidden"><b>شما حذف شده‌اید</b><p>می‌توانید به عنوان روح حرکت کنید.</p></div></div>
<div id="toast"></div>
<div id="mapModal" class="overlay hidden"><div class="mapCard"><button id="closeMap" class="close" type="button">✕</button><h2>🗺️ نقشه ایستگاه</h2><canvas id="bigMap"></canvas><p>دایره‌های قرمز چشمک‌زن = مأموریت‌های باقی‌مانده</p></div></div>
<div id="meeting" class="overlay hidden"><div class="meetingCard"><h2 id="meetingTitle">📢 جلسه</h2><div id="meetingTimer"></div><p id="meetingReason"></p><div id="meetingClaims"></div><div id="voteArea" class="hidden"><h3>به چه کسی رأی می‌دهید؟</h3><div id="voteList"></div><button id="skipVote" type="button">رأی سفید / رد کردن</button></div><div id="meetingResult"></div><button id="leaveMeeting" class="hidden" type="button">ادامه بازی</button></div></div>
<div id="end" class="overlay hidden"><div class="meetingCard"><h1 id="winner"></h1><button onclick="location.reload()" type="button">بازی جدید</button></div></div>
<script src="/socket.io/socket.io.js"></script><script src="game.js"></script></body></html>
